spring.application.name=dog-seizure-tracker

spring.mvc.hiddenmethod.filter.enabled=true

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MYSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

users.defaultUser.username=defaultUser
users.defaultUser.password=defaultPassword
users.defaultUser.firstName=firstName
users.defaultUser.lastName=lastName
users.defaultUser.email=default@Email.com


