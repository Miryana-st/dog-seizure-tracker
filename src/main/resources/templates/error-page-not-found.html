<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oops! Something Went Wrong</title>

    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/button.css">
    <link rel="stylesheet" href="/css/head.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/error-page-not-found.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>
<main class="error-page">
    <section class="error-card">
        <img src="/images/page-not-found.png" alt="Sad dog illustration" class="error-image">
        <h1>Page Not Found!</h1>
        <h2>Looks like this page went for a walk and got lost.</h2>
        <p>The page you are looking for does not exist or may have been moved. Let's get you back on track and continue caring for your furry friend.</p>
        <div class="error-actions">
            <a href="/static" class="button register-button"><i class="fa-solid fa-house"></i>Home</a>
            <button onclick="history.back()" class="cancel-button"><i class="fa-solid fa-arrow-left"></i>Go Back</button>
        </div>
        <div class="error-tip"><i class="fa-solid fa-paw"></i>
            <span>404 - Page Not Found</span>
        </div>
    </section>
</main>
<footer th:insert="fragments/footer :: footer"></footer>
</body>
</html>
