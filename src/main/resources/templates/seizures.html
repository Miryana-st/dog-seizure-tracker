<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - Dog Seizure Tracker</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/button.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/seizures.css">
    <link rel="stylesheet" href="/css/head.css">
    <link rel="stylesheet" href="/css/side-nav-bar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"/>
</head>
<body>
<header th:insert="fragments/head-logged :: navigation" class="section section-header"></header>
<main class="main-content">
    <section th:insert="fragments/side-nav-bar :: side-nav-bar"></section>
    <section class="seizures-section">
        <h1>Seizure Log</h1>
        <div class="seizures-table">
            <table>
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Duration</th>
                    <th>Severity</th>
                    <th>Recovery</th>
                    <th>Notes</th>
                    <th>Cluster</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="seizure : ${seizures}">
                    <td th:text="${seizure.date!= null ? (T(java.time.format.DateTimeFormatter).ofPattern('MMMM d, yyyy').format(seizure.date)) : ''}"></td>
                    <td th:text="${seizure.time}"></td>
                    <td th:text="${seizure.duration + ' sec'}"></td>
                    <td>
                        <p th:if="${seizure.severity != null}"
                           th:class="${'severity-' + seizure.severity.name().toLowerCase()}"
                           th:text="${seizure.severity.displaySeverity}">
                        </p>
                    </td>

                    <td>
                        <p th:if="${seizure.recovery != null}"
                           th:class="${'recovery-' + seizure.recovery.name().toLowerCase()}"
                           th:text="${seizure.recovery.displayRecovery}">
                        </p>
                    </td>
                    <td th:text="${seizure.note}"></td>
                    <td>
                        <i th:class="${seizure.cluster} ?
                            'fa-solid fa-check cluster-yes' :
                             'fa-solid fa-xmark cluster-no'">
                        </i>
                    </td>
                    <td class="button-table">
                        <div class="button-in-table">
                            <a th:href="@{'/dogs/' + ${dogId} + '/seizures/' + ${seizure.id} + '/details'}"
                               class="edit-seizure"><i class="fa-solid fa-pen-to-square"></i></a>
                            <form th:action="@{'/dogs/' + ${dogId} + '/seizures/' + ${seizure.id}}" th:method="DELETE"
                                  th:attr="onclick='return confirm(\'Are you sure you want to delete seizure?\')'">
                                <button type="submit"><i class="fa-solid fa-trash"></i></button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(seizures)}">
                    <td colspan="8">No seizures logged in.</td>
                </tr>
                </tbody>
            </table>

            <div class="button button-container">
                <a th:href="@{/dogs/{id}/seizures/new(id=${dogId})}" class="button add-seizure">Add New Seizure</a>
            </div>
        </div>
        <div class="button-container-second">
            <a th:href="@{/dogs/{id}/seizures/pdf(id=${dogId})}" class="button generate-pdf"><i
                    class="fa-solid fa-file-pdf"></i>Export PDF</a>
            <a th:if="${monthlyReportAvailable}"
               th:href="@{/dogs/{id}/seizures/monthly-report(id=${dogId})}"
               class="button monthly-report">
                <i class="fa-solid fa-file-pdf"></i>
                Download Monthly Report
            </a>
        </div>
    </section>

    <section class="seizure-summary">
        <h2 th:text="'Seizure Summary - ' + ${#temporals.format(T(java.time.LocalDate).now().minusMonths(1),'MMMM yyyy')}">Seizure Summary - July 2026</h2>
        <div class="summary-stat">
            <span>Total seizures: </span>
            <strong th:text="${seizureSummary.totalSeizures}"></strong>
        </div>
        <div class="summary-stat">
            <span>Average duration: </span>
            <strong>
                <span th:text="${seizureSummary.averageDuration}"></span> seconds
            </strong>
        </div>
        <div class="summary-stat">
            <span>Longest seizure: </span>
            <strong>
                <span th:text="${seizureSummary.longestDuration}"></span> seconds
            </strong>
        </div>
    </section>

</main>
<footer th:insert="fragments/footer :: footer"></footer>
</body>
</html>
