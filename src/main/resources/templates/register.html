<!DOCTYPE html><html lang="en" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Register - Dog Seizure Tracker</title>    <link rel="stylesheet" href="/css/common.css">    <link rel="stylesheet" href="/css/button.css">    <link rel="stylesheet" href="/css/form.css">    <link rel="stylesheet" href="/css/footer.css">    <link rel="stylesheet" href="/css/form.css">    <link rel="stylesheet" href="/css/head.css">    <link rel="stylesheet" href="/css/register.css"></head><body><header class="section section-header">    <section class="navigation">        <nav class="nav">            <div class="nav-components">                <div class="site-title">                    <div class="logo-container">                        <a href="/"><img src="/images/primary-logo-removedbg-preview.png" alt="DST Logo"></a>                    </div>                </div>                <div class="links">                    <a th:href="@{/register}" class="button register-button">Register</a>                    <a th:href="@{/login}" class="button login-button">Login</a>                </div>            </div>        </nav>    </section></header><main class="main-content">    <section class="heading">        <section class="intro centered">            <h1>Create an Account</h1>            <p>Sign up to start tracking seizures and health reports for your dog.</p>            <div class="form-panel">                <form class="register-form" th:action="@{/register}" th:object="${userRegisterRequest}"                      th:method="POST">                    <div class="form-row-one">                        <div class="form-row">                            <div class="form-data">                                <label for="username">Username</label>                                <input type="text" placeholder="Username" id="username" th:field="*{username}" required>                            </div>                            <small class="alert-warning" th:if="${#fields.hasErrors('username')}"                                   th:errors="*{username}"></small>                        </div>                    </div>                    <div class="form-row-one">                        <div class="form-row">                            <div class="form-data">                                <label for="first-name">First name</label>                                <input type="text" placeholder="First name" id="first-name" th:field="*{firstName}"                                       required>                            </div>                            <small class="alert-warning" th:if="${#fields.hasErrors('firstName')}"                                   th:errors="*{firstName}"></small>                        </div>                    </div>                    <div class="form-row-one">                        <div class="form-row">                            <div class="form-data">                                <label for="last-name">Last name</label>                                <input type="text" placeholder="Last name" id="last-name" th:field="*{lastName}"                                       required>                            </div>                            <small class="alert-warning" th:if="${#fields.hasErrors('lastName')}"                                   th:errors="*{lastName}"></small>                        </div>                    </div>                    <div class="form-row-one">                        <div class="form-row">                            <div class="form-data">                                <label for="email">Email</label>                                <input type="email" placeholder="you@example.com" id="email" th:field="*{email}"                                       required>                            </div>                            <small class="alert-warning" th:if="${#fields.hasErrors('email')}"                                   th:errors="*{email}"></small>                        </div>                    </div>                    <div class="form-row-one">                        <div class="form-row">                            <div class="form-data">                                <label for="password">Password</label>                                <input type="password" placeholder="••••••••" id="password" th:field="*{password}"                                       required>                            </div>                            <small class="alert-warning" th:if="${#fields.hasErrors('password')}"                                   th:errors="*{password}"></small>                        </div>                    </div>                    <div class="form-actions">                        <button type="submit" class="button register-button">Create Account</button>                        <div sec:authorize="hasRole('ROLE_ADMIN')">                            <a th:href="@{/users}" class="button cancel-button">Cancel</a>                        </div>                    </div>                </form>            </div>        </section>    </section></main><footer th:insert="fragments/footer :: footer"></footer></body></html>
