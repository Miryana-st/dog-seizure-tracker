<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Monthly Seizure Report</title>
    <link rel="stylesheet" href="css/seizure-report.css"/>
</head>
<body>
<div class="report-container">
    <div class="report-header"><h1>Monthly Seizure Report</h1>
        <h2 th:text="${#temporals.format(month, 'MMMM yyyy')}"> July 2026 </h2>
        <p> Total seizures: <strong th:text="${#lists.size(seizures)}">0</strong></p></div>
    <div class="seizures-table">
        <table>
            <thead>
            <tr>
                <th>Date</th>
                <th>Time</th>
                <th>Duration</th>
                <th>Severity</th>
                <th>Recovery</th>
                <th>Notes</th>
                <th>Cluster</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="seizure : ${seizures}">
                <td th:text="${seizure.date != null ? T(java.time.format.DateTimeFormatter) .ofPattern('MMMM d, yyyy') .format(seizure.date) : ''}"></td>
                <td th:text="${seizure.time}"></td>
                <td th:text="${seizure.duration + ' seconds'}"></td>
                <td><span th:if="${seizure.severity != null}"
                          th:class="${'severity-' + seizure.severity.name().toLowerCase()}"
                          th:text="${seizure.severity.displaySeverity}"> </span> <span
                        th:unless="${seizure.severity != null}"> - </span></td>
                <td><span th:if="${seizure.recovery != null}"
                          th:class="${'recovery-' + seizure.recovery.name().toLowerCase()}"
                          th:text="${seizure.recovery.displayRecovery}"> </span> <span
                        th:unless="${seizure.recovery != null}"> - </span></td>
                <td th:text="${seizure.note != null ? seizure.note : '-'}"></td>
                <td><span th:if="${seizure.isCluster}" class="cluster-yes"> Yes </span> <span
                        th:unless="${seizure.isCluster}" class="cluster-no"> No </span></td>
            </tr>
            <tr th:if="${#lists.isEmpty(seizures)}">
                <td colspan="7"> No seizures were recorded during this month.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
